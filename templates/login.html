<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login | Security Shield</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-dark: #1a1a2e;
            --secondary-dark: #16213e;
            --accent-color: #e94560;
            --text-light: #f1f1f1;
        }

        body {
            background-color: #0f3460;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-light);
            margin: 0;
        }

        .login-card {
            background-color: var(--primary-dark);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card h2 {
            margin-bottom: 30px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .login-card .icon-box {
            font-size: 4rem;
            color: var(--accent-color);
            margin-bottom: 20px;
        }

        .form-control {
            background-color: var(--secondary-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .form-control:focus {
            background-color: var(--secondary-dark);
            border-color: var(--accent-color);
            color: var(--text-light);
            box-shadow: none;
        }

        .btn-login {
            background-color: var(--accent-color);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 10px;
            width: 100%;
            font-weight: bold;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        .btn-login:hover {
            background-color: #c62a48;
            transform: translateY(-2px);
        }
        input::placeholder {
            color: white !important;
        }

        .footer-text {
            margin-top: 20px;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="icon-box">
            <i class="fas fa-shield-alt"></i>
        </div>
        <h2>Secure Login</h2>
        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="mb-3">
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-0 text-light"><i class="fas fa-user"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Username" required>
                </div>
            </div>
            <div class="mb-3">
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-0 text-light"><i class="fas fa-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-login">Login to Dashboard</button>
        </form>
        <p class="footer-text">Security Monitoring System &copy; 2026</p>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
